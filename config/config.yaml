app_info:
    name: go.redsock.ru/mead
    version: v0.0.14
    startup_duration: 10s
data_sources:
    - resource_name: postgres
      migrations_folder: ./migrations
      host: localhost
      port: 5432
      user: postgres
      pwd: ""
      name: postgres
      ssl_mode: ""
    - resource_name: telegram
      api_key: ""
servers:
    3081:
        /{GRPC}:
            module: go.redsock.ru/mead
            gateway: /api
environment:
    - name: address
      type: string
      value: 0.0.0.0:3080
    - name: api_token
      type: string
      value: "1251"
    - name: dial_timeout
      type: duration
      value: 30s
    - name: log_format
      type: string
      enum: [JSON, TEXT]
      value: TEXT
    - name: log_level
      type: string
      enum: [Trace, Debug, Info, Warn, Error, Fatal, Panic]
      value: Info
    - name: proxy_address
      type: string
      value: vpn.redsock.ru
    - name: proxy_port
      type: int
      value: 3080
    - name: read_timeout
      type: duration
      value: 1m0s
