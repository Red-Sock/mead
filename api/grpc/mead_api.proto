syntax = "proto3";

package mead_api;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "npm.proto";

option go_package = "/mead_api";
option (npm_package) = "@ruf/mead";

service MeadAPI {
  rpc Version(Version.Request) returns (Version.Response) {
    option (google.api.http) = {
      get: "/api/version"
    };
  };

  rpc CreateUser(CreateUser.Request) returns (CreateUser.Response) {
    option (google.api.http) = {
      post: "/api/user"
      body: "*"
    };
  };

  rpc ListStatistics(ListStatistics.Request) returns (ListStatistics.Response) {
    option (google.api.http) = {
      post: "/api/statistics"
    };
  };
}

message Version {
  message Request {}

  message Response {
    string version = 1;
    google.protobuf.Timestamp client_timestamp = 2;
  }
}

message CreateUser {
  message Request {
    oneof payload {
      string username = 1;
      ManyUsers usernames = 2;
    }

    message ManyUsers {
      repeated string usernames = 2;
    }
  }

  message Response {}
}

message ListStatistics {
  message Request {
  }

  message Response {
    repeated UserStatistic stas = 1;
  }
}

message UserStatistic {
  string username = 1;
  string last_connect = 2;
  int64 bytes_passed = 3;
}

