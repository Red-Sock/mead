syntax = "proto3";

package mead_api;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "npm.proto";

option go_package = "/mead_api";
option (npm_package) = "@ruf/mead";

service MeadAPI {
  rpc Version(Version.Request) returns (Version.Response) {
    option (google.api.http) = {
      get: "/api/version"
    };
  };

  rpc CreateUser(CreateUser.Request) returns (CreateUser.Response) {
    option (google.api.http) = {
      post: "/api/user"
      body: "*"
    };
  };
}

message CreateUser {
  message Request {
    string username = 1;
    string password = 2;
  }

  message Response {}
}

message Version {
  message Request {}

  message Response {
    string version = 1;
    google.protobuf.Timestamp client_timestamp = 2;
  }
}
