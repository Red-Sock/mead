version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/storage/sqlite/queries/users.sql"
    schema:
      - "migrations/*.sql"
    gen:
      go:
        package: "user_queries"
        out: "internal/storage/sqlite/user_queries"
        sql_package: "database/sql"
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
